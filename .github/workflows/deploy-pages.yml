name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Thay bằng tên branch của bạn nếu cần (ví dụ: master)
    paths:
      - 'public/index.html' # 1. CHỈ chạy khi file index.html trong thư mục public thay đổi

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public' # 2. Chỉ đóng gói và deploy các file nằm TRONG thư mục public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
