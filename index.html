<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Application Portal</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --surface: #ffffff;
      --text: #172033;
      --muted: #718096;
      --line: #e8edf4;
      --primary: #4f6bed;
      --primary-soft: #eef1ff;
      --shadow: 0 8px 28px rgba(25, 42, 70, .06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      max-width: 1280px;
      margin: 0 auto;
      padding: 34px 17px 54px;
    }

    .intro {
      margin-bottom: 30px;
    }

    .eyebrow {
      color: var(--primary);
      font-size: 12px;
      font-weight: 750;
      letter-spacing: 1.2px;
      text-transform: uppercase;
    }

    h1 {
      margin: 9px 0 8px;
      font-size: clamp(28px, 4vw, 38px);
      letter-spacing: -1.2px;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }

    .app-card {
      min-width: 396px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 17px;
      box-shadow: 0 2px 8px rgba(25, 42, 70, .02);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    }

    .app-card:hover {
      transform: translateY(-4px);
      border-color: #d5dcff;
      box-shadow: var(--shadow);
    }

    .card-top {
      display: flex;
      align-items: center;
      gap: 13px;
      margin-bottom: 18px;
    }

    .avatar {
      width: 54px;
      height: 54px;
      flex: 0 0 54px;
      display: grid;
      place-items: center;
      border-radius: 15px;
      color: white;
      font-size: 22px;
      font-weight: 750;
      background: var(--avatar-bg, linear-gradient(135deg, #637cf6, #8a5cf6));
    }

    .app-name {
      margin: 0 0 4px;
      font-size: 15px;
      font-weight: 750;
    }

    .domain {
      color: var(--muted);
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      margin-left: auto;
      align-self: flex-start;
      white-space: nowrap;
      font-size: 11px;
      color: #16845b;
      background: #eaf8f1;
      padding: 5px 8px;
      border-radius: 20px;
    }

    .card-title {
      margin: 0 0 7px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.4;
    }

    .description {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      min-height: 24px;
    }

    .card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      border-top: 1px solid var(--line);
      margin-top: 17px;
      padding-top: 14px;
    }

    .category {
      color: #65728a;
      background: #f3f5f9;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 11px;
    }

    .visit {
      color: var(--primary);
      font-size: 12px;
      font-weight: 700;
    }

    .empty {
      display: none;
      text-align: center;
      color: var(--muted);
      padding: 50px 20px;
      background: white;
      border: 1px dashed var(--line);
      border-radius: 16px;
    }

    footer {
      text-align: center;
      color: #9aa5b5;
      font-size: 12px;
      padding: 0 20px 28px;
    }

    @media (max-width: 1290px) {
      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 880px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 13px;
      }

      select {
        flex: 1;
      }

      .app-card {
        padding: 17px;
      }
    }
  </style>
</head>

<body>
  <header></header>
  <main>
    <section class="intro">
      <div class="eyebrow">Demo apps</div>
      <h1>Danh sách ứng dụng</h1>
      <p class="subtitle">Khám phá và truy cập nhanh các ứng dụng trong hệ thống.</p>
    </section>

    <section class="grid" id="appGrid"></section>
    <div class="empty" id="emptyState">Không tìm thấy ứng dụng phù hợp.</div>
  </main>
  <footer>Application Portal · Một nơi để truy cập mọi công cụ</footer>

  <script>
    const applications = [
      {
        name: "Code Explorer",
        url: "https://front-end-2021.github.io/demo/code-explorer/",
        avatar: "📋",                 // Có thể thay bằng URL ảnh: avatar: "https://..."
        avatarBackground: "linear-gradient(135deg,#4776e6,#6b5ce7)",
        title: "Trình khám phá mã nguồn",
        description: "Vẽ sơ đồ quan hệ giữa các file trong một thư mục dự án (C#, Java, Kotlin, Python, JS/TS, Vue, HTML, CSS) ngay trong trình duyệt. Mã nguồn chỉ được đọc cục bộ, không tải lên đâu cả.",
        category: "Project explorer",
        status: "Hoạt động"
      },
      {
        name: "Todo task",
        url: "https://front-end-2021.github.io/demo/todotask/",
        avatar: "📊",
        avatarBackground: "linear-gradient(135deg,#0ba985,#47c7a4)",
        title: "Hệ thống quản lý nhiệm vụ",
        description: "Theo dõi danh sách công việc, ưu tiên và tiến độ hoàn thành trên một giao diện đơn giản.",
        category: "Quản lý công việc",
        status: "Hoạt động"
      },
    ];

    const grid = document.getElementById("appGrid");
    const emptyState = document.getElementById("emptyState");

    function getDomain(url) {
      try { return new URL(url).hostname; }
      catch { return url; }
    }

    function createCard(app) {
      const link = document.createElement("a");
      link.className = "app-card";
      link.href = app.url;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", `Truy cập ${app.name}`);

      const avatarContent = app.avatar
        ? `<div class="avatar" style="--avatar-bg:${app.avatarBackground || "linear-gradient(135deg,#637cf6,#8a5cf6)"}">${app.avatar}</div>`
        : `<div class="avatar">${(app.name || "?").charAt(0).toUpperCase()}</div>`;

      link.innerHTML = `
        <div class="card-top">
          ${avatarContent}
          <div style="min-width:0">
            <p class="app-name"></p>
            <div class="domain"></div>
          </div>
          <span class="status"></span>
        </div>
        <h3 class="card-title"></h3>
        <p class="description"></p>
        <div class="card-footer">
          <span class="category"></span>
          <span class="visit">Truy cập ứng dụng ↗</span>
        </div>
      `;
      link.querySelector(".app-name").textContent = app.name || "Chưa đặt tên";
      link.querySelector(".domain").textContent = app.domain || getDomain(app.url || "");
      link.querySelector(".status").textContent = app.status || "Chưa cập nhật";
      link.querySelector(".card-title").textContent = app.title || app.name || "";
      link.querySelector(".description").textContent = app.description || "";
      link.querySelector(".category").textContent = app.category || "Khác";
      if (app.status && app.status.toLowerCase() !== "hoạt động") {
        link.querySelector(".status").style.color = "#a66a13";
        link.querySelector(".status").style.background = "#fff5df";
      }
      return link;
    }

    function renderApplications() {
      const filtered = applications
      grid.replaceChildren(...filtered.map(createCard));
      emptyState.style.display = filtered.length ? "none" : "block";
    }
    renderApplications()
  </script>
</body>

</html>
